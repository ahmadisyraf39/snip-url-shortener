<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snip</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-6">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl">Snip</h1>
      <p class="text-sm text-base-content/60 -mt-2">Paste a long URL, get a short one back.</p>

      <form id="shorten-form" class="join mt-4 w-full">
        <input
          type="url"
          id="url-input"
          placeholder="https://example.com/a/very/long/path"
          required
          class="input join-item flex-1"
        />
        <button type="submit" class="btn btn-primary join-item">Shorten</button>
      </form>

      <div id="result" role="alert" class="alert mt-4 hidden"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://snip-api-3939-ecgdgpegayfhfehh.southeastasia-01.azurewebsites.net";

    const form = document.getElementById("shorten-form");
    const input = document.getElementById("url-input");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      result.classList.add("hidden");
      result.classList.remove("alert-success", "alert-error");

      try {
        const res = await fetch(`${API_BASE_URL}/api/links`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: input.value })
        });
        if (!res.ok) throw new Error(`Server responded ${res.status}`);
        const data = await res.json();
        result.classList.add("alert-success");
        result.innerHTML = `<span>Short link: <a href="${data.shortUrl}" class="link link-hover font-semibold">${data.shortUrl}</a></span>`;
      } catch (err) {
        result.classList.add("alert-error");
        result.innerHTML = `<span>Couldn't reach the backend. (<code class="bg-black/10 px-1 rounded">${err.message}</code>)</span>`;
      } finally {
        result.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
